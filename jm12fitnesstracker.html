<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12-Week Transformation Tracker</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background: #0f1117;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            color: #f8fafc;
            text-align: center;
            font-size: 1.7em;
            margin: 8px 0 4px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.85em;
            margin-bottom: 24px;
        }

        .card {
            background: #1e2130;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2d3148;
        }

        .card-title {
            color: #7dd3fc;
            margin: 0 0 16px 0;
            font-size: 1.05em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ── 12-Week Progress ── */

        .progress-bar-track {
            background: #0f1117;
            border-radius: 99px;
            height: 18px;
            margin: 4px 0 8px;
            overflow: hidden;
            border: 1px solid #2d3148;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #16a34a, #4ade80);
            border-radius: 99px;
            transition: width 0.4s ease;
            min-width: 0;
        }

        .progress-text {
            text-align: center;
            color: #4ade80;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .weeks-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        @media (max-width: 480px) {
            .weeks-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .week-tile {
            aspect-ratio: 1;
            border-radius: 10px;
            border: 2px solid #2d3148;
            background: #161928;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.75em;
            font-weight: 700;
            color: #94a3b8;
            user-select: none;
            gap: 2px;
        }

        .week-tile:hover { border-color: #4ade80; color: #4ade80; }

        .week-tile.done {
            background: #14532d;
            border-color: #4ade80;
            color: #4ade80;
        }

        .week-tile .check-mark {
            font-size: 1.1em;
            line-height: 1;
        }

        /* ── Meal List ── */

        .date-badge {
            font-size: 0.78em;
            color: #64748b;
            margin-bottom: 12px;
        }

        .meal-item {
            display: flex;
            align-items: center;
            padding: 11px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: #161928;
            border: 1px solid #2d3148;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
            gap: 12px;
        }

        .meal-item:hover { border-color: #7dd3fc; }

        .meal-item.done {
            background: #0d1a0d;
            border-color: #14532d;
        }

        .meal-item.done .meal-text {
            text-decoration: line-through;
            color: #475569;
        }

        .meal-circle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #334155;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            transition: all 0.15s;
            color: transparent;
        }

        .meal-item.done .meal-circle {
            background: #16a34a;
            border-color: #16a34a;
            color: white;
        }

        .meal-text {
            font-size: 0.9em;
            color: #cbd5e1;
            transition: all 0.15s;
        }

        /* ── Workout Sections ── */

        .workout-day {
            margin-bottom: 12px;
            border: 1px solid #2d3148;
            border-radius: 10px;
            overflow: hidden;
        }

        .workout-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #161928;
            cursor: pointer;
            user-select: none;
            gap: 10px;
        }

        .workout-header:hover { background: #1a1f35; }

        .workout-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .workout-title {
            font-size: 0.92em;
            font-weight: 600;
            color: #e2e8f0;
        }

        .workout-done-badge {
            font-size: 0.72em;
            background: #14532d;
            color: #4ade80;
            padding: 2px 8px;
            border-radius: 99px;
            font-weight: 600;
        }

        .chevron {
            color: #475569;
            font-size: 0.75em;
            transition: transform 0.2s;
        }

        .chevron.open { transform: rotate(90deg); }

        .workout-body {
            display: none;
            padding: 0 0 12px;
        }

        .workout-body.open { display: block; }

        .table-wrap {
            overflow-x: auto;
            padding: 12px 16px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.84em;
        }

        thead th {
            background: #0f1117;
            color: #7dd3fc;
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }

        tbody td {
            padding: 8px 10px;
            border-bottom: 1px solid #1e2130;
            vertical-align: middle;
            color: #cbd5e1;
        }

        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: #1a1f35; }

        .ex-name-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-btn {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 1px solid #334155;
            background: transparent;
            color: #64748b;
            font-size: 0.72em;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            line-height: 1;
            padding: 0;
        }

        .info-btn:hover {
            border-color: #7dd3fc;
            color: #7dd3fc;
            background: #0f1117;
        }

        .ex-input {
            width: 68px;
            padding: 4px 6px;
            background: #0f1117;
            border: 1px solid #2d3148;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 0.9em;
            text-align: center;
            transition: border-color 0.15s;
        }

        .ex-input:focus {
            outline: none;
            border-color: #7dd3fc;
        }

        .info-row td {
            color: #f59e0b;
            font-size: 0.82em;
            font-style: italic;
            background: #1a1505;
        }

        .workout-footer {
            padding: 10px 16px 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-complete {
            padding: 6px 14px;
            background: #161928;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.82em;
            font-weight: 600;
            transition: all 0.15s;
        }

        .btn-complete:hover {
            border-color: #4ade80;
            color: #4ade80;
        }

        .btn-complete.active {
            background: #14532d;
            border-color: #4ade80;
            color: #4ade80;
        }

        /* ── Form Tips Modal ── */

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: #1e2130;
            border: 1px solid #2d3148;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 16px;
            background: none;
            border: none;
            color: #64748b;
            font-size: 1.3em;
            cursor: pointer;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 6px;
            transition: color 0.15s;
        }

        .modal-close:hover { color: #e2e8f0; }

        .modal-exercise-name {
            font-size: 1.1em;
            font-weight: 700;
            color: #f8fafc;
            margin: 0 28px 4px 0;
        }

        .modal-muscle-tag {
            display: inline-block;
            font-size: 0.72em;
            background: #0f3460;
            color: #7dd3fc;
            padding: 2px 10px;
            border-radius: 99px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .modal-tips-heading {
            font-size: 0.75em;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
        }

        .modal-tips {
            list-style: none;
            margin: 0 0 20px;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-tips li {
            display: flex;
            gap: 10px;
            font-size: 0.88em;
            color: #cbd5e1;
            line-height: 1.45;
        }

        .modal-tips li::before {
            content: '→';
            color: #7dd3fc;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .modal-yt-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px;
            background: #1e0a0a;
            border: 1px solid #7f1d1d;
            border-radius: 10px;
            color: #fca5a5;
            font-size: 0.85em;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
        }

        .modal-yt-btn:hover {
            background: #3b0f0f;
            border-color: #ef4444;
            color: #fecaca;
        }

        .yt-icon {
            font-size: 1.1em;
        }
    </style>
</head>
<body>

<!-- Form tips modal -->
<div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
        <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
        <div class="modal-exercise-name" id="modal-title"></div>
        <div class="modal-muscle-tag" id="modal-muscle"></div>
        <div class="modal-tips-heading">Key form cues</div>
        <ul class="modal-tips" id="modal-tips"></ul>
        <a class="modal-yt-btn" id="modal-yt" target="_blank" rel="noopener noreferrer">
            <span class="yt-icon">▶</span> Search YouTube for form tutorial
        </a>
    </div>
</div>

<div class="container">
    <h1>12-Week Transformation Tracker</h1>
    <div class="subtitle" id="today-label"></div>

    <!-- 12-Week Progress -->
    <div class="card">
        <div class="card-title">📅 12-Week Progress</div>
        <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <div class="progress-text" id="progress-text"></div>
        <div class="weeks-grid" id="weeks-grid"></div>
    </div>

    <!-- Daily Nutrition -->
    <div class="card">
        <div class="card-title">🍎 Daily Nutrition</div>
        <div class="date-badge" id="meal-date-badge"></div>
        <div id="meal-list"></div>
    </div>

    <!-- Workouts -->
    <div class="card">
        <div class="card-title">🏋️ Weekly Workout Plan</div>
        <div id="workout-container"></div>
    </div>
</div>

<script>

    document.getElementById('today-label').textContent =
        new Date().toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    document.getElementById('meal-date-badge').textContent =
        'Tracking meals for ' + new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

    // ── Workout data ──────────────────────────────────────────────
    const workoutDays = [
        {
            id: 'mon',
            label: 'Monday (Day 1) — Chest & Triceps',

                {
                    name: 'Dumbbell Incline bench press',

                        'Drive the movement by squeezing your chest, not by bending or straightening the elbows',
                        'Bring hands together in front of your chest, thumbs nearly touching at the peak',
                        'Control the eccentric — don\'t let the cables yank your arms back',

                    name: 'Crossbody hammer curls',
                    sets: '3', reps: '10-15', weight: '10', rest: '60',
                    muscle: 'Brachialis · Brachioradialis · Biceps',
                    tips: [
                        'Hold dumbbells with a neutral (hammer) grip — thumbs facing up throughout',
                        'Curl one dumbbell across your body toward the opposite shoulder',
                        'Keep your upper arm stationary; only the forearm moves',
                        'The crossbody angle targets the brachialis more than a standard curl',
                        'Alternate arms or complete all reps on one side — either way, control the descent',
                    ],
                },
                {
                    name: 'EZ Bar preacher curl',
                    sets: '3', reps: '8-10', weight: '10', rest: '60',
                    muscle: 'Biceps brachii (short head) · Brachialis',
                    tips: [
                        'Rest upper arms flat on the angled pad — they must stay in contact throughout',
                        'Use the inner (angled-in) grips on the EZ bar for a more natural wrist position',
                        'Lower the bar until arms are almost fully extended — don\'t hyperextend at the bottom',
                        'Curl up until the bar is near your chin; squeeze biceps hard at the top',
                        'The preacher pad eliminates cheating, so you must use a lighter weight than a standing curl',
                    ],
                },
                {
                    name: 'Barbell bicep curl',
                    sets: '2', reps: '8', weight: '17.5', rest: '60',
                    muscle: 'Biceps brachii · Brachialis',
                    tips: [
                        'Stand with feet shoulder-width, barbell at arms\' length with underhand grip',
                        'Pin elbows to the sides — they should barely move throughout the set',
                        'Curl the bar up in a smooth arc, fully contracting the biceps at the top',
                        'Do not swing the torso or use momentum — if you are, reduce the weight',
                        'Lower all the way back to full arm extension to hit the full range of motion',
                    ],
                },
                {
                    name: 'Cable rope triceps extension',
                    sets: '4', reps: '12', weight: '40', rest: '60',
                    muscle: 'Triceps (all 3 heads)',
                    tips: [
                        'Attach the rope handle; stand facing the cable stack with a slight forward lean',
                        'Keep elbows pinned at your sides — they should not move at all during the rep',
                        'As you push down, spread the rope apart at the bottom to maximise the contraction',
                        'Squeeze the triceps hard at full extension; hold briefly before returning',
                        'Control the return slowly (2–3 seconds) — the eccentric builds just as much muscle',
                    ],
                },
                {
                    name: 'Plate weighted dip',
                    sets: '3', reps: '8-12', weight: 'Body Weight', rest: '60',
                    muscle: 'Triceps · Lower chest · Front delts',
                    tips: [
                        'Attach a plate with a dip belt, or hold between your feet; start with just bodyweight until form is solid',
                        'For triceps focus: keep torso upright, elbows tucked close to your sides',
                        'For more chest involvement: lean slightly forward and let elbows flare more',
                        'Lower until upper arms are at least parallel to the floor — don\'t half-rep',
                        'Press back up without fully locking out — keep a slight elbow bend at the top to maintain tension',
                    ],
                },
                {
                    name: 'Cable standing overhead triceps extension',
                    sets: '3', reps: '15-20', weight: '20', rest: '60',
                    muscle: 'Triceps long head',
                    tips: [
                        'Face away from the cable, set the pulley low; step forward into a stagger stance',
                        'Raise arms overhead so upper arms are beside your ears — they stay there the whole set',
                        'Extend fully at the top, locking out and squeezing the triceps',
                        'Lower slowly until you feel a deep stretch in the triceps behind your head',
                        'Keep your core braced to avoid lumbar extension as the weight pulls overhead',
                    ],
                },
            ],
            notes: [],
        },
    ];

    // ── Meals ─────────────────────────────────────────────────────
    const meals = [
        'Meal 1: Sourdough, Cheese, Eggs, Banana',
        'Meal 2: Chicken, Rice, Veg, Olive Oil',
        'Meal 3: Pork Mince, Potatoes, Asparagus / Green Veg, Olive Oil',
        'Meal 4: Oats, Whey Protein, Chocolate, Blueberries',
    ];

    function buildMeals() {
        const list = document.getElementById('meal-list');
        meals.forEach((meal, i) => {
            const key = `meal-${today}-${i}`;
            const done = localStorage.getItem(key) === 'true';

            const item = document.createElement('div');
            item.className = 'meal-item' + (done ? ' done' : '');

            const circle = document.createElement('div');
            circle.className = 'meal-circle';
            circle.textContent = done ? '✓' : '';

            const text = document.createElement('span');
            text.className = 'meal-text';
            text.textContent = meal;

            item.append(circle, text);
            item.addEventListener('click', () => {
                const now = localStorage.getItem(key) === 'true';
                localStorage.setItem(key, !now);
                item.classList.toggle('done', !now);
                circle.textContent = !now ? '✓' : '';
            });

            list.appendChild(item);
        });
    }

    // ── 12-Week tracker ──────────────────────────────────────────
    function buildWeeks() {
        const grid = document.getElementById('weeks-grid');
        for (let i = 1; i <= 12; i++) {
            const done = localStorage.getItem(`week-${i}`) === 'true';

            const tile = document.createElement('div');
            tile.className = 'week-tile' + (done ? ' done' : '');

            const label = document.createElement('span');
            label.textContent = `W${i}`;

            const check = document.createElement('span');
            check.className = 'check-mark';
            check.textContent = done ? '✓' : '';

            tile.append(label, check);
            tile.addEventListener('click', () => {
                const now = localStorage.getItem(`week-${i}`) === 'true';
                localStorage.setItem(`week-${i}`, !now);
                tile.classList.toggle('done', !now);
                check.textContent = !now ? '✓' : '';
                refreshProgress();
            });

            grid.appendChild(tile);
        }
        refreshProgress();
    }

    function refreshProgress() {
        let count = 0;
        for (let i = 1; i <= 12; i++) {
            if (localStorage.getItem(`week-${i}`) === 'true') count++;
        }
        const pct = Math.round((count / 12) * 100);
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('progress-text').textContent =
            `${count} of 12 weeks complete — ${pct}%`;
    }

    // ── Form tips modal ───────────────────────────────────────────
    const overlay   = document.getElementById('modal-overlay');
    const modalClose = document.getElementById('modal-close');

    function openModal(exercise) {
        document.getElementById('modal-title').textContent  = exercise.name;
        document.getElementById('modal-muscle').textContent = exercise.muscle;

        const tipsList = document.getElementById('modal-tips');
        tipsList.innerHTML = '';
        exercise.tips.forEach(tip => {
            const li = document.createElement('li');
            li.textContent = tip;
            tipsList.appendChild(li);
        });

        const ytLink = document.getElementById('modal-yt');
        ytLink.href = 'https://www.youtube.com/results?search_query=' +
            encodeURIComponent(exercise.name + ' proper form tutorial');

        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        overlay.classList.remove('open');
        document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    // ── Workouts ─────────────────────────────────────────────────
    function buildWorkouts() {
        const container = document.getElementById('workout-container');

        workoutDays.forEach(day => {
            const dayDoneKey = `workout-${day.id}-done-${today}`;
            const dayDone = localStorage.getItem(dayDoneKey) === 'true';

            const wrap = document.createElement('div');
            wrap.className = 'workout-day';

            // Header
            const header = document.createElement('div');
            header.className = 'workout-header';

            const left = document.createElement('div');
            left.className = 'workout-header-left';

            const title = document.createElement('span');
            title.className = 'workout-title';
            title.textContent = day.label;
            left.appendChild(title);

            if (dayDone) {
                const badge = document.createElement('span');
                badge.className = 'workout-done-badge';
                badge.textContent = 'Done today ✓';
                left.appendChild(badge);
            }

            const chevron = document.createElement('span');
            chevron.className = 'chevron';
            chevron.textContent = '▶';

            header.append(left, chevron);

            // Body
            const body = document.createElement('div');
            body.className = 'workout-body';

            const tableWrap = document.createElement('div');
            tableWrap.className = 'table-wrap';

            const table = document.createElement('table');
            table.innerHTML = `<thead><tr>
                <th>Exercise</th>
                <th>Sets</th>
                <th>Reps</th>
                <th>Weight (kg)</th>
                <th>Rest (s)</th>
            </tr></thead>`;

            const tbody = document.createElement('tbody');

            day.exercises.forEach((ex, rowIdx) => {
                const tr = document.createElement('tr');

                const makeInput = (field, def) => {
                    const key = `workout-${day.id}-${rowIdx}-${field}`;
                    const inp = document.createElement('input');
                    inp.type = 'text';
                    inp.className = 'ex-input';
                    inp.value = localStorage.getItem(key) ?? def;
                    inp.addEventListener('change', () => localStorage.setItem(key, inp.value));
                    return inp;
                };

                // Exercise name cell with info button
                const tdName = document.createElement('td');
                const nameCell = document.createElement('div');
                nameCell.className = 'ex-name-cell';

                const nameSpan = document.createElement('span');
                nameSpan.textContent = ex.name;

                const infoBtn = document.createElement('button');
                infoBtn.className = 'info-btn';
                infoBtn.textContent = 'i';
                infoBtn.title = 'View form cues';
                infoBtn.setAttribute('aria-label', `Form tips for ${ex.name}`);
                infoBtn.addEventListener('click', e => {
                    e.stopPropagation();
                    openModal(ex);
                });

                nameCell.append(nameSpan, infoBtn);
                tdName.appendChild(nameCell);

                const tdSets   = document.createElement('td'); tdSets.appendChild(makeInput('sets', ex.sets));
                const tdReps   = document.createElement('td'); tdReps.appendChild(makeInput('reps', ex.reps));
                const tdWeight = document.createElement('td'); tdWeight.appendChild(makeInput('weight', ex.weight));
                const tdRest   = document.createElement('td'); tdRest.appendChild(makeInput('rest', ex.rest));

                tr.append(tdName, tdSets, tdReps, tdWeight, tdRest);
                tbody.appendChild(tr);
            });

            day.notes.forEach(note => {
                const tr = document.createElement('tr');
                tr.className = 'info-row';
                const td = document.createElement('td');
                td.colSpan = 5;
                td.textContent = note;
                tr.appendChild(td);
                tbody.appendChild(tr);
            });

            table.appendChild(tbody);
            tableWrap.appendChild(table);
            body.appendChild(tableWrap);

            // Mark complete button
            const footer = document.createElement('div');
            footer.className = 'workout-footer';

            const btn = document.createElement('button');
            btn.className = 'btn-complete' + (dayDone ? ' active' : '');
            btn.textContent = dayDone ? 'Completed today ✓' : 'Mark as complete';

            btn.addEventListener('click', e => {
                e.stopPropagation();
                const now = localStorage.getItem(dayDoneKey) === 'true';
                localStorage.setItem(dayDoneKey, !now);
                btn.classList.toggle('active', !now);
                btn.textContent = !now ? 'Completed today ✓' : 'Mark as complete';
            });

            footer.appendChild(btn);
            body.appendChild(footer);

            header.addEventListener('click', () => {
                const open = body.classList.toggle('open');
                chevron.classList.toggle('open', open);
            });

            wrap.append(header, body);
            container.appendChild(wrap);
        });
    }

    buildWeeks();
    buildMeals();
    buildWorkouts();
</script>

</body>
</html>
